name: CI

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Show Node.js version
        run: node --version

      - name: Show npm version
        run: npm --version

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Run backend tests
        run: npm test
        working-directory: backend

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Set image version
        run: echo "VERSION=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Build backend Docker image
        run: docker build -t manoj98gopal/ecommerce-backend:$VERSION ./backend

      - name: Build frontend Docker image
        run: docker build -t manoj98gopal/ecommerce-frontend:$VERSION ./frontend

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push backend Docker image
        run: docker push manoj98gopal/ecommerce-backend:$VERSION

      - name: Push frontend Docker image
        run: docker push manoj98gopal/ecommerce-frontend:$VERSION

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/devops-ecommerce-platform
            git pull origin main
            sudo VERSION=${{ env.VERSION }} docker compose -f docker-compose.prod.yml pull
            sudo VERSION=${{ env.VERSION }} docker compose -f docker-compose.prod.yml up -d
